name: dotnet_test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 10.0.x
    - name: Test
      run: |
        dotnet test test/FileParty.Core.Tests/FileParty.Core.Tests.csproj --configuration Release --no-build --verbosity normal
        dotnet test test/FileParty.Core.Registration.Tests/FileParty.Core.Registration.csproj --configuration Release --no-build --verbosity normal
        dotnet test test/FileParty.Handlers.FileSystem.Tests/FileParty.Handlers.FileSystem.Tests.csproj --configuration Release --no-build --verbosity normal
        dotnet test test/FileParty.Handlers.AWS.S3.Tests/FileParty.Handlers.AWS.S3.Tests.csproj --configuration Release-V3 --no-build --verbosity normal
        dotnet test test/FileParty.Handlers.AWS.S3.Tests/FileParty.Handlers.AWS.S3.Tests.csproj --configuration Release-V4 --no-build --verbosity normal
      env:
        "fileparty_s3_region": ${{ secrets.TEST_S3_REGION }}
        "fileparty_s3_bucket": ${{ secrets.TEST_S3_BUCKET }}
        "fileparty_s3_access_key": ${{ secrets.TEST_S3_ACCESS_KEY }}
        "fileparty_s3_secret_key": ${{ secrets.TEST_S3_SECRET_KEY }}
        "fileparty_s3_role_arn": ${{ secrets.TEST_S3_ROLE_ARN }}
        "fileparty_s3_role_external_id": ${{ secrets.TEST_S3_ROLE_EXTERNAL_ID }}
