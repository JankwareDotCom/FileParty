name: csharp_nuget_publish
on:
  pull_request:
    branches: ['main','develop']
    types: [closed]
    
jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    # Declaring permissions sets every unlisted one to none, so list both explicitly.
    permissions:
      contents: write   # nuget_publish tags the published commit using GITHUB_TOKEN
      id-token: write   # GitHub OIDC token, exchanged for a nuget.org key below
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # nuget.org trusted publishing: exchange the GitHub OIDC token for a short-lived (1 hour) API key.
      # Needs a matching Trusted Publishing policy on nuget.org (account "Jankware") for this repo + publish.yml.
      - name: NuGet login (trusted publishing)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: Jankware
      - name: Build and Publish Nuget Packages
        id: csharp_nuget_publish
        uses: JankwareDotCom/nuget_publish@0.4.1
        with: 
          PROJECT_FILE_PATHS: './src/FileParty.Core/FileParty.Core.csproj,./src/FileParty.Providers.FileSystem/FileParty.Providers.FileSystem.csproj,./src/FileParty.Providers.AWS.S3/FileParty.Providers.AWS.S3.csproj'
          NUGET_SOURCE: ${{secrets.JANKWARE_NUGET_SOURCE}}
          NUGET_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          #VERSION_REGEX: '^\s*<Version>(.*)<\/Version>\s*$'
          INCLUDE_SYMBOLS: 'true'
          TAG_COMMIT: 'develop,main'
          TAG_FORMAT: 'v*'
          BRANCH_VERSION_SUFFIXES: 'develop=pre-{yyoooHHmm}-*'
          REPO_TOKEN: ${{secrets.GITHUB_TOKEN}}
